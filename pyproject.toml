[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ava-military-research"
version = "0.1.0"
description = "Defensive research scaffold for AVA's governed local-first architecture"
requires-python = ">=3.11"
dependencies = ["psutil>=6.0,<8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
