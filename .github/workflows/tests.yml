name: tests

on:
  push:
    branches: ["main", "foundation/**", "feature/**", "feat/**", "work/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Verify bare pytest collection before package installation
        run: pytest --collect-only -q
      - run: python -m pip install -e .
      - name: Anchor regression tests
        run: pytest tests/test_anchor.py
      - name: COLD transaction recovery tests
        run: pytest tests/test_cold_log_tx_recovery.py
      - name: Historical provenance tests
        run: pytest tests/test_memory_braid_unanchored.py
      - name: Shared cross-process lock tests
        run: pytest tests/test_shared_cross_process_lock.py
      - name: AVO provenance gate tests
        run: pytest tests/test_avo_provenance_gate.py
      - name: Full repository test suite
        run: pytest
      - name: Smoke-test Windows foundation installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -Runtime "$env:RUNNER_TEMP/ava-foundation-runtime"
      - name: Smoke-test Linux foundation installer
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/install.sh "$RUNNER_TEMP/ava-foundation-runtime"
